<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeBell</title>
    <link rel="stylesheet" href="Assets/main.css">
</head>


<body>
    <header>
        <audio src="" id="audio"></audio>
        <img src="Assets/logoPokebell.png" alt="">
        
        <nav>
            <ul>
                <li id="pokedex" class="btn">Pokedex</li>
                <li id="versus" class="btn">Versus</li>
                <li class="btn">Historique</li>
            </ul>
        </nav>
        <div class="shadow"></div>

        <img class= "Logo" src="Assets/pikaben-removebg-preview.png" alt="Pikachu dessiner en paint">

    </header>
    
    <div id="main-container">
        
        <nav>
            <!-- <h2>Menu</h2> -->
            
            <select name="deroul" id="listing" >
                <option value = "def">Choissisez un pokemon </option>
                <option value="9999">Pikaben</option>
            </select>
            
            <div id="last_choice"></div>
            
            
        </nav>
        
        <div class="loader" id="loader"></div>
        <main>
            <div>
                    <div id="affichage"></div>
                <div id="rightScreen">
                    <!-- <canvas id="myChart"></canvas> -->
                    
                </div>
                <div id="btnScreen">
                    <div id="Info">
                                                
                    </div>
                    <div id="Stat">
                    </div>
                    <div id="Visu"></div>
                    <div id="Atq"></div>
                    <div id="Cri"></div>
                </div>
                <img src="Assets/testpoke.png" alt="">
            </div>
    
        </main>

    </div>

    <div id="versus-container">

        <div id="selectionPoke">

            <div id="select1">
                <div id="1stPokeAff"><p>test</p></div>

                <select name="" id="1stPoke" class="1stPoke">
                    <option value="1">test</option>
                </select>
            </div>
            
            <button id="battle" class="eclate-btn">Battle</button>
    
            <div id="select2">

                <div id="2ndPokeAff"><p>test2</p></div>
                <select name="" id="2ndPoke" class="2ndPoke">
                    <option value="1">test2</option>
                </select>
            </div>

        </div>
        
    </div>

    <div id="versus-battle">

        <div id="battlePoke">

            <div id="backBattle"> <p>test</p></div>
            <div id="statMyPoke"><p>test</p></div>
            <div id="statYourePoke"><p>test</p></div>
            <div id="spriteMyPoke"><p>test</p></div>
            <div id="spriteYourePoke"><p>test</p></div>

        </div>

    </div>


    <footer>

        <div class="foot">
            <img src="Assets/Carapuce-RB.png" height="50" alt="">
            <img src="Assets/Tauros-RB.png" height="50" alt="">
            <img src="Assets/Draco-RB.png" height="50" alt="">
        </div>

        <div class="foot">
            &copy; BNJ - 2025
        </div>
        
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" class=""></script>
 
    <script src="Script/main.js"></script>
</body>


</html>
